# 默认 LLM 配置
model:
  provider: openai       # openai | anthropic | google | ollama
  name: gpt-4o
  api_key: ""            # 建议通过环境变量 OPENAI_API_KEY 设置，留空即可
  temperature: 0.7
  max_tokens: 2048

# 请求设置
request:
  timeout: 60            # 秒
  max_retries: 3

# 日志
logging:
  level: INFO            # DEBUG | INFO | WARNING | ERROR
